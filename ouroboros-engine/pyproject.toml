[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-engine"
version = "0.1.0"
description = "Laboratório experimental de agentes adaptativos em PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "PyYAML>=6,<7"]

[project.scripts]
ouroboros-run = "ouroboros.cli:run"
ouroboros-bootstrap = "ouroboros.cli:bootstrap"
ouroboros-dashboard = "ouroboros.cli:dashboard"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.setuptools.package-data]
ouroboros = ["dashboard.html"]
